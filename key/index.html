<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quenhook.cfd - HWID Reset</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { display: ['Space Grotesk', 'ui-sans-serif', 'system-ui'] } } } }
    </script>
    <style>
        .glow-purple { box-shadow: 0 0 40px rgba(147, 51, 234, 0.15), 0 0 80px rgba(147, 51, 234, 0.05); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .anim-in { animation: fadeIn 0.4s ease-out; }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-display relative overflow-x-hidden">
    <div class="pointer-events-none absolute inset-0 -z-10 bg-[radial-gradient(circle_at_20%_20%,rgba(147,51,234,0.18),transparent_35%),radial-gradient(circle_at_85%_10%,rgba(16,185,129,0.18),transparent_30%),radial-gradient(circle_at_50%_90%,rgba(59,130,246,0.14),transparent_32%)]"></div>
    <div class="pointer-events-none absolute inset-0 -z-20 bg-[linear-gradient(120deg,rgba(255,255,255,0.04)_1px,transparent_1px),linear-gradient(0deg,rgba(255,255,255,0.03)_1px,transparent_1px)] bg-[size:36px_36px] opacity-30"></div>

    <div class="relative min-h-screen flex items-center justify-center px-4 py-10">
        <div class="w-full max-w-md anim-in">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-purple-500/15 border border-purple-500/30 mb-4">
                    <i class="fa-solid fa-rotate-left text-2xl text-purple-300"></i>
                </div>
                <h1 class="text-3xl font-bold text-white">HWID Reset</h1>
                <p class="mt-2 text-sm text-slate-400">Reset your hardware lock to use your license on a new PC.</p>
            </div>

            <div class="rounded-2xl border border-slate-800/70 bg-slate-900/70 shadow-[0_20px_70px_rgba(0,0,0,0.45)] backdrop-blur-xl p-6 space-y-5 glow-purple">
                <div class="space-y-2">
                    <label for="licenseKey" class="text-sm font-semibold text-slate-200">License Key</label>
                    <input type="text" id="licenseKey" placeholder="Enter your license key" maxlength="64"
                        class="w-full rounded-xl border border-slate-800 bg-slate-900/70 px-4 py-3.5 text-sm text-slate-100 shadow-inner shadow-black/30 placeholder:text-slate-500 focus:border-purple-400 focus:outline-none focus:ring-2 focus:ring-purple-400/40 transition"
                        autocomplete="off" spellcheck="false">
                </div>

                <button id="resetBtn" onclick="handleReset()"
                    class="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-purple-600 px-4 py-3.5 text-sm font-semibold text-white shadow-lg shadow-purple-600/25 transition hover:bg-purple-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-purple-300 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-rotate-left" id="btnIcon"></i>
                    <span id="btnText">Reset HWID</span>
                </button>

                <div id="result" class="hidden rounded-xl border px-4 py-3 text-sm font-medium transition-all"></div>
            </div>

            <div class="mt-6 text-center text-xs text-slate-600">
                <i class="fa-regular fa-clock mr-1"></i>
                HWID can be reset once every 7 days.
            </div>
        </div>
    </div>

    <script>
        // CHANGE THIS to your deployed Worker URL
        const WORKER_URL = 'https://crimson-thunder-7e0c.itzincvx.workers.dev/';

        const btn = document.getElementById('resetBtn');
        const btnIcon = document.getElementById('btnIcon');
        const btnText = document.getElementById('btnText');
        const result = document.getElementById('result');
        const keyInput = document.getElementById('licenseKey');

        keyInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleReset(); });

        async function handleReset() {
            const key = keyInput.value.trim();
            if (!key) { showResult('Please enter a license key.', false); return; }

            btn.disabled = true;
            btnIcon.className = 'fa-solid fa-spinner fa-spin';
            btnText.textContent = 'Resetting...';
            result.classList.add('hidden');

            try {
                const res = await fetch(WORKER_URL + '/reset-hwid', { method: 'POST', body: JSON.stringify({ key }), headers: { 'Content-Type': 'application/json' } });
                const data = await res.json();
                showResult(data.message || data.error, data.status === 'success');
            } catch { showResult('Network error. Please try again.', false); }

            btn.disabled = false;
            btnIcon.className = 'fa-solid fa-rotate-left';
            btnText.textContent = 'Reset HWID';
        }

        function showResult(message, isSuccess) {
            result.classList.remove('hidden', 'border-emerald-500/50', 'bg-emerald-500/10', 'text-emerald-100', 'border-rose-500/50', 'bg-rose-500/10', 'text-rose-100');
            result.textContent = message;
            if (isSuccess) result.classList.add('border-emerald-500/50', 'bg-emerald-500/10', 'text-emerald-100');
            else result.classList.add('border-rose-500/50', 'bg-rose-500/10', 'text-rose-100');
            result.style.animation = 'none';
            result.offsetHeight;
            result.style.animation = 'fadeIn 0.3s ease-out';
        }
    </script>
</body>
</html>
